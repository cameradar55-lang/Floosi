<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f8b5b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Floosi">
<link rel="manifest" href="manifest.json">
<title>Floosi — فلوسي</title>
<style>
:root{--bg:#f3f7f5;--card:#fff;--ink:#15221b;--muted:#78867e;--green:#19a463;--green2:#0f8b5b;--yellow:#e5a52f;--red:#e05252;--line:#e5ebe7;--shadow:0 10px 28px rgba(25,60,42,.08)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif}
body{padding-bottom:calc(78px + env(safe-area-inset-bottom))}
button,input,select{font:inherit}button{border:0;cursor:pointer}
.app{max-width:720px;margin:auto}
.top{padding:22px 18px 14px;background:linear-gradient(150deg,#0f8b5b,#19a463);color:#fff;border-radius:0 0 30px 30px}
.brand{display:flex;align-items:center;justify-content:space-between}.brand h1{margin:0;font-size:28px;letter-spacing:-.5px}.brand small{opacity:.8}
.date{text-align:center;margin-top:12px;font-weight:700}.month{text-align:center;margin-top:4px;opacity:.78;font-size:12px}
main{padding:14px 14px 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:17px;margin:12px 0}
.balance-card{text-align:center;padding:20px 14px 18px}
.ring{width:220px;height:220px;margin:4px auto 12px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--ring) var(--pct),#e7eeea 0);position:relative;box-shadow:0 12px 35px rgba(25,70,48,.10)}
.ring:before{content:"";position:absolute;inset:12px;border-radius:50%;background:#fff}
.ring-in{position:relative}.ring-amount{font-size:34px;font-weight:900;letter-spacing:-1px}.ring-label{font-size:12px;color:var(--muted);margin-top:3px}
.status{font-weight:900;color:var(--ring);font-size:15px}.sub{font-size:12px;color:var(--muted);margin-top:5px}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}.metric{background:#f7faf8;border-radius:17px;padding:12px;text-align:right}.metric span{font-size:11px;color:var(--muted)}.metric b{display:block;font-size:18px;margin-top:4px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick button{padding:15px;border-radius:18px;font-weight:800;background:#eef8f2;color:#08734a}.quick button:nth-child(2){background:#fff4f0;color:#c54c35}
.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}.section-title h2{font-size:17px;margin:0}.link{background:none;color:var(--green2);font-weight:800;font-size:12px}
.row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:#f3f7f5;font-size:22px;flex:none}.row-main{flex:1}.row-main b{display:block;font-size:14px}.row-main span{display:block;font-size:11px;color:var(--muted);margin-top:3px}.amount{font-weight:900}.income{color:var(--green2)}.expense{color:#c94d3e}
.empty{text-align:center;color:var(--muted);padding:20px 5px;font-size:13px}
.bottom{position:fixed;z-index:20;bottom:0;left:0;right:0;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center}.nav{max-width:720px;width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.nav button{background:none;color:#7a867f;padding:7px 2px;border-radius:13px;font-size:11px;font-weight:700}.nav button.active{color:var(--green2);background:#edf8f2}.nav .ni{display:block;font-size:21px;margin-bottom:2px}
.fab{position:fixed;z-index:21;bottom:88px;left:50%;transform:translateX(-50%);width:58px;height:58px;border-radius:50%;background:var(--green2);color:white;font-size:30px;box-shadow:0 12px 28px rgba(15,139,91,.30)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.cat{background:#f8faf9;border:1px solid var(--line);border-radius:17px;padding:11px 3px;text-align:center;font-size:10px;font-weight:800}.cat .ico{margin:auto;background:#eef5f1}
.progress{height:12px;background:#e8eeea;border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,#18a463,#48c47f);border-radius:99px;width:0}
.modal{position:fixed;inset:0;background:rgba(13,24,18,.38);display:none;align-items:flex-end;z-index:50}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-width:720px;margin:auto;border-radius:28px 28px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}.sheet h2{margin:0 0 15px;font-size:21px}.field{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:15px;background:#fafcfb;margin:5px 0 11px;outline:none}.field:focus{border-color:#7bc7a4}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:5px}.primary,.secondary{padding:13px;border-radius:15px;font-weight:900}.primary{background:var(--green2);color:#fff}.secondary{background:#edf1ef;color:#39463f}.closex{float:left;background:#f1f4f2;width:34px;height:34px;border-radius:50%;font-size:20px}
.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef7f1;color:#0c7950;font-size:10px;font-weight:800}.danger{background:#fff0ee;color:#c94d3e}.warning{background:#fff7df;color:#a87312}
.debt-card{padding:13px 0;border-bottom:1px solid var(--line)}.debt-head{display:flex;justify-content:space-between;gap:8px}.debt-title{font-weight:900}.debt-meta{font-size:11px;color:var(--muted);margin-top:4px}.debt-actions{display:flex;gap:7px;margin-top:8px}.smallbtn{padding:8px 11px;border-radius:11px;background:#edf8f2;color:#08734a;font-size:11px;font-weight:800}
.goal-ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;margin:5px auto 15px;background:conic-gradient(#19a463 var(--gpct),#e8eeea 0)}.goal-ring:before{content:"";position:absolute}.goal-inner{width:120px;height:120px;border-radius:50%;background:white;display:grid;place-items:center;text-align:center}.goal-inner b{font-size:25px}.goal-inner span{font-size:10px;color:var(--muted)}
.toast{position:fixed;z-index:80;top:18px;left:50%;transform:translateX(-50%);background:#15221b;color:#fff;padding:11px 15px;border-radius:14px;font-size:12px;display:none;box-shadow:0 8px 25px #0003}.toast.show{display:block}
@media(max-width:390px){.ring{width:195px;height:195px}.grid4{grid-template-columns:repeat(4,1fr)}.metric b{font-size:16px}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<button class="fab" onclick="openAdd()">＋</button>
<div class="bottom"><div class="nav">
<button data-page="home" onclick="go('home')"><span class="ni">🏠</span>الرئيسية</button>
<button data-page="transactions" onclick="go('transactions')"><span class="ni">🧾</span>المعاملات</button>
<button data-page="debts" onclick="go('debts')"><span class="ni">💳</span>الديون</button>
<button data-page="goal" onclick="go('goal')"><span class="ni">🏡</span>الهدف</button>
</div></div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
const KEY='floosi_v1';
const cats={food:['🍽️','أكل'],fuel:['⛽','وقود'],rent:['🏠','كراء'],electric:['💡','كهرباء'],phone:['📱','هاتف'],internet:['🌐','إنترنت'],car:['🚗','سيارة'],kids:['👨‍👩‍👧‍👦','أطفال'],fun:['🎉','خروجات'],shopping:['🛒','مشتريات'],personal:['☕','مصروفي الخاص'],smoking:['🚬','تدخين'],cafe:['☕','مقهى'],debt:['💳','أقساط وديون'],other:['📦','أخرى']};
const defaultBudgets={food:400,fuel:100,fun:200,kids:200,shopping:200,personal:0,smoking:0,cafe:0};
const defaultData={
 opening:550,
 incomes:[],
 expenses:[],
 debts:[
  {id:'d1',title:'كهرباء سبتمبر',total:245,paid:0,due:'2026-09-30'},
  {id:'d2',title:'مدرسة سبتمبر',total:180,paid:0,due:'2026-09-30'},
  {id:'d3',title:'Scalapay المستخدم سبتمبر',total:200,paid:0,due:'2026-09-30'},
  {id:'d4',title:'Scalapay الزوجة سبتمبر',total:267,paid:0,due:'2026-09-30'},
  {id:'d5',title:'كراء سبتمبر',total:250,paid:0,due:'2026-10-10'},
  {id:'d6',title:'Scalapay المستخدم أكتوبر',total:200,paid:0,due:'2026-10-31'},
  {id:'d7',title:'Scalapay الزوجة أكتوبر',total:220,paid:0,due:'2026-10-31'},
  {id:'d8',title:'مدرسة متأخرة',total:280,paid:0,due:'2026-11-10'},
  {id:'d9',title:'دراسة الابن',total:280,paid:0,due:'2026-11-10'},
  {id:'d10',title:'Scalapay المستخدم نوفمبر',total:104,paid:0,due:'2026-11-30'},
  {id:'d11',title:'كهرباء مؤجلة',total:205,paid:0,due:'2026-11-30'},
  {id:'d12',title:'الصديق',total:300,paid:0,due:'2026-12-01'}
 ],
 recurringIncomes:[
  {id:'ri1',title:'فلوس زكرياء',amount:550,day:1,start:'2026-10-01'},
  {id:'ri2',title:'راتبي',amount:1700,day:10,start:'2026-11-10'},
  {id:'ri3',title:'فلوس الأطفال',amount:900,day:20,start:'2026-09-20'}
 ],
 recurringExpenses:[
  {id:'re1',title:'كراء',amount:250,day:10,start:'2026-10-10',cat:'rent'},
  {id:'re2',title:'تأمين السيارة',amount:165,day:5,start:'2026-10-05',cat:'car'},
  {id:'re3',title:'كهرباء',amount:150,day:15,start:'2026-10-15',cat:'electric'},
  {id:'re4',title:'إنترنت',amount:50,day:1,start:'2026-10-01',cat:'internet'},
  {id:'re5',title:'أكل وشرب',amount:400,day:1,start:'2026-10-01',cat:'food'},
  {id:'re6',title:'خروجات',amount:200,day:20,start:'2026-10-20',cat:'fun'},
  {id:'re7',title:'وقود',amount:100,day:20,start:'2026-10-20',cat:'fuel'},
  {id:'re8',title:'هاتف',amount:50,day:5,start:'2026-10-05',cat:'phone'},
  {id:'re9',title:'مصاريف الأطفال',amount:200,day:1,start:'2026-10-01',cat:'kids'},
  {id:'re10',title:'دراسة الابن',amount:280,day:10,start:'2026-11-10',cat:'kids'}
 ],
 goal:{name:'شراء منزل',target:30000,saved:0},
 budgets:defaultBudgets
};
let data=load(); if(!data.recurringExpenses.some(r=>r.title==='تدخين')) data.recurringExpenses.push({id:'re_smoke',title:'تدخين',amount:0,day:1,start:'2026-09-01',cat:'smoking'}); if(!data.recurringExpenses.some(r=>r.title==='مقهى')) data.recurringExpenses.push({id:'re_cafe',title:'مقهى',amount:0,day:1,start:'2026-09-01',cat:'cafe'}); data.recurringIncomes.forEach((r,i)=>{if(!r.id)r.id='ri'+i+Date.now()}); data.recurringExpenses.forEach((r,i)=>{if(!r.id)r.id='re'+i+Date.now()}); save(); let page='home';

function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x){
  if(x.opening==null && x.balance!=null) x.opening=x.balance;
  if(!Array.isArray(x.incomes)) x.incomes=[]; if(!Array.isArray(x.expenses)) x.expenses=[];
  if(!Array.isArray(x.debts)) x.debts=[]; if(!x.goal) x.goal=structuredClone(defaultData.goal);
  if(!Array.isArray(x.recurringIncomes)) x.recurringIncomes=[];
  if(!Array.isArray(x.recurringExpenses)) x.recurringExpenses=[]; if(!Array.isArray(x.paidRecurring)) x.paidRecurring=[]; if(!x.budgets) x.budgets=structuredClone(defaultBudgets); else x.budgets={...defaultBudgets,...x.budgets};
  x.recurringIncomes=x.recurringIncomes.map(r=>{let z={...r};if(z.amount===550&&z.day===1){z.title='فلوس زكرياء';z.start='2026-10-01';}if(z.amount===1700&&z.day===10){z.title='راتبي';z.start='2026-11-10';}if(z.amount===900){z.title='فلوس الأطفال';z.day=20;z.start='2026-09-20';}return z});
  return {...structuredClone(defaultData),...x};
}}catch(e){}return structuredClone(defaultData)}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function money(n){return new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(n||0)}
function dateObj(s){return new Date(s+'T12:00:00')}
function fmtDate(s){if(!s)return 'بدون تاريخ';return dateObj(s).toLocaleDateString('ar-TN',{day:'numeric',month:'short',year:'numeric'})}
function localISO(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function todayISO(){return localISO()}
function daysLeft(s){return Math.ceil((dateObj(s)-new Date())/86400000)}
function txTotals(){let today=todayISO();let inc=data.incomes.filter(x=>!x.date||x.date<=today).reduce((a,x)=>a+x.amount,0), exp=data.expenses.filter(x=>!x.date||x.date<=today).reduce((a,x)=>a+x.amount,0);return {inc,exp}}
function currentBalance(){let t=txTotals();return data.opening+t.inc-t.exp}
function unpaidDebts(){return data.debts.reduce((a,d)=>a+Math.max(0,d.total-d.paid),0)}
function monthBounds(){let now=new Date(), y=now.getFullYear(), m=now.getMonth();return {from:`${y}-${String(m+1).padStart(2,'0')}-01`,to:`${y}-${String(m+1).padStart(2,'0')}-${String(new Date(y,m+1,0).getDate()).padStart(2,'0')}`}}
function monthCommitments(){let {from,to}=monthBounds();let debts=data.debts.filter(d=>d.due>=from&&d.due<=to&&d.total>d.paid).reduce((a,d)=>a+Math.max(0,d.total-d.paid),0);let recurring=recurringInstances(data.recurringExpenses,from,to).filter(r=>!data.paidRecurring.includes(r.id+'_'+r.date)).reduce((a,r)=>a+r.amount,0);return debts+recurring}
function safeSpend(){return Math.max(0,currentBalance()-monthCommitments())}
function recurringInstances(list,from,to){
 let out=[];let s=dateObj(from), e=dateObj(to);
 list.forEach(r=>{let cur=new Date(s.getFullYear(),s.getMonth(),1);while(cur<=e){let y=cur.getFullYear(),m=cur.getMonth(),day=Math.min(r.day,new Date(y,m+1,0).getDate());let dt=new Date(y,m,day);let ds=localISO(dt);if(dt>=s&&dt<=e&&ds>=r.start)out.push({...r,date:ds});cur=new Date(y,m+1,1)}});return out
}
function upcomingIncome(days=45){let t=todayISO(), e=new Date();e.setDate(e.getDate()+days);return recurringInstances(data.recurringIncomes,t,localISO(e)).sort((a,b)=>a.date.localeCompare(b.date))}
function upcomingExpense(days=45){let t=todayISO(), e=new Date();e.setDate(e.getDate()+days);return recurringInstances(data.recurringExpenses,t,localISO(e)).sort((a,b)=>a.date.localeCompare(b.date))}
function monthSpent(cat){let {from,to}=monthBounds();return data.expenses.filter(x=>x.cat===cat&&x.date>=from&&x.date<=to).reduce((a,x)=>a+x.amount,0)}
function budgetCards(){return Object.entries(data.budgets||{}).filter(([k,v])=>cats[k]&&v>0).map(([k,b])=>{let spent=monthSpent(k),rem=Math.max(0,b-spent),pct=Math.min(100,spent/b*100);return `<div class="budget-card"><div class="row"><div class="ico">${cats[k][0]}</div><div class="row-main"><b>${cats[k][1]}</b><span>${money(spent)} من ${money(b)}</span></div><div class="amount">${money(rem)}</div></div><div class="progress"><i style="width:${pct}%"></i></div><small style="color:var(--muted)">متبقي ${money(rem)} · ${Math.round(pct)}% مستخدم</small></div>`}).join('')}
function health(){
 let b=currentBalance(), debt=monthCommitments(), safe=Math.max(0,b-debt), ratio=b>0?safe/b:0;
 if(safe<=0)return {c:'#e05252',pct:100,status:'انتبه للدفعات 🔴',safe};
 if(ratio<.35)return {c:'#e5a52f',pct:Math.max(8,ratio*100),status:'اقترب من الحد 🟡',safe};
 return {c:'#19a463',pct:Math.max(8,Math.min(100,ratio*100)),status:'في برّ الأمان 🟢',safe};
}
function header(){
 let now=new Date(), day=now.toLocaleDateString('ar-TN',{weekday:'long'}), full=now.toLocaleDateString('ar-TN',{day:'numeric',month:'long',year:'numeric'}), month=now.toLocaleDateString('ar-TN',{month:'long',year:'numeric'});
 return `<div class="top"><div class="brand"><h1>Floosi</h1><small>إدارة أموالك بوضوح</small></div><div class="date">${day}، ${full}</div><div class="month">${month} · اليوم ${now.getDate()} من الشهر</div></div>`;
}
function render(){
 document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
 let content=page==='home'?home():page==='transactions'?transactions():page==='debts'?debts():goal();
 document.getElementById('app').innerHTML=header()+`<main>${content}</main>`;
}
function home(){
 let h=health(), inc=upcomingIncome(45).slice(0,3), ex=upcomingExpense(45).slice(0,3), b=currentBalance(), debt=unpaidDebts(), goalPct=Math.min(100,data.goal.saved/data.goal.target*100);
 return `<div class="card balance-card">
  <div class="ring" style="--ring:${h.c};--pct:${h.pct}%"><div class="ring-in"><div class="ring-amount">${money(h.safe)}</div><div class="ring-label">المتاح للصرف بأمان</div></div></div>
  <div class="status" style="--ring:${h.c};color:${h.c}">${h.status}</div><div class="sub">بعد احتساب التزامات هذا الشهر فقط</div>
  <div class="metrics"><div class="metric"><span>الرصيد الحالي</span><b>${money(b)}</b></div><button class="metric" onclick="openMonthCommitments()"><span>التزامات هذا الشهر</span><b>${money(monthCommitments())}</b><small>اضغط للتفاصيل ›</small></button></div>
  <div class="sub" style="margin-top:8px">إجمالي الديون والالتزامات القادمة: <b>${money(debt)}</b></div>
 </div>
 <div class="quick"><button onclick="openAdd('expense')">− إضافة مصروف</button><button onclick="openAdd('income')">＋ إضافة دخل</button></div>
 <div class="card"><div class="section-title"><h2>دفعات قادمة</h2><button class="link" onclick="go('debts')">كل الديون</button></div>
 ${data.debts.filter(d=>d.total>d.paid).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,4).map(d=>`<div class="row"><div class="ico">💳</div><div class="row-main"><b>${d.title}</b><span>${fmtDate(d.due)} · ${daysLeft(d.due)>=0?'بعد '+daysLeft(d.due)+' يوم':'متأخر'}</span></div><div class="amount">${money(d.total-d.paid)}</div></div>`).join('')||'<div class="empty">لا توجد ديون متبقية 🎉</div>'}</div>
 <div class="card"><div class="section-title"><h2>الدخل المتكرر</h2><button class="link" onclick="openRecurring('income')">إدارة</button></div>
 ${inc.map(x=>`<div class="row"><div class="ico">💰</div><div class="row-main"><b>${x.title}</b><span>${fmtDate(x.date)}</span></div><div class="amount income">+${money(x.amount)}</div></div>`).join('')||'<div class="empty">لا يوجد دخل قادم</div>'}</div>
 <div class="card"><div class="section-title"><h2>ميزانيات هذا الشهر</h2><button class="link" onclick="openBudgets()">إدارة</button></div>${budgetCards()||'<div class="empty">لم تحدد ميزانيات بعد.</div>'}</div>
 <div class="card"><div class="section-title"><h2>هدف المنزل 🏡</h2><button class="link" onclick="go('goal')">التفاصيل</button></div>
 <div class="progress"><i style="width:${goalPct}%"></i></div><div style="display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--muted)"><span>${money(data.goal.saved)}</span><b>${Math.round(goalPct)}%</b><span>${money(data.goal.target)}</span></div></div>
 <div class="card"><div class="section-title"><h2>إضافة مصروف سريع</h2></div><div class="grid4">${Object.entries(cats).slice(0,8).map(([k,v])=>`<button class="cat" onclick="openAdd('expense','${k}')"><span class="ico">${v[0]}</span>${v[1]}</button>`).join('')}</div></div>`;
}
function transactions(){
 let all=[...data.incomes.map(x=>({...x,type:'income'})),...data.expenses.map(x=>({...x,type:'expense'}))].sort((a,b)=>b.date.localeCompare(a.date));
 return `<div class="card"><div class="section-title"><h2>المعاملات</h2><button class="link" onclick="openAdd()">＋ إضافة</button></div>${all.map((x,i)=>`<div class="row"><div class="ico">${x.type==='income'?'💰':(cats[x.cat]?.[0]||'📦')}</div><div class="row-main"><b>${x.title}</b><span>${fmtDate(x.date)}</span></div><div class="amount ${x.type}">${x.type==='income'?'+':'−'}${money(x.amount)}</div></div>`).join('')||'<div class="empty">لم تسجل أي معاملات بعد.</div>'}</div>
 <div class="card"><div class="section-title"><h2>المتكرر</h2><button class="link" onclick="openRecurring()">إدارة</button></div><div class="quick"><button onclick="openRecurring('income')">💰 دخل متكرر</button><button onclick="openRecurring('expense')">🔁 مصروف متكرر</button></div></div>`;
}
function debts(){
 return `<div class="card"><div class="section-title"><h2>الديون والالتزامات</h2><button class="link" onclick="openDebt()">＋ إضافة</button></div>
 ${data.debts.sort((a,b)=>a.due.localeCompare(b.due)).map((d,i)=>{let rem=Math.max(0,d.total-d.paid),pct=d.total?d.paid/d.total*100:100;return `<div class="debt-card"><div class="debt-head"><div><div class="debt-title">${d.title}</div><div class="debt-meta">استحقاق: ${fmtDate(d.due)} · ${rem?('باقي '+money(rem)):'مدفوع بالكامل'}</div></div><span class="pill ${rem?'warning':''}">${rem?Math.round(pct)+'% مدفوع':'تم الدفع'}</span></div><div class="progress" style="margin-top:9px"><i style="width:${pct}%"></i></div>${rem?`<div class="debt-actions"><button class="smallbtn" onclick="payDebt('${d.id}')">تسجيل دفعة</button><button class="smallbtn" onclick="removeDebt('${d.id}')">حذف</button></div>`:''}</div>`}).join('')}</div>`;
}
function goal(){
 let pct=Math.min(100,data.goal.saved/data.goal.target*100), remain=Math.max(0,data.goal.target-data.goal.saved);
 return `<div class="card" style="text-align:center"><h2 style="margin:0 0 3px">${data.goal.name} 🏡</h2><div class="sub">هدفك للدفعة الأولى</div><div class="goal-ring" style="--gpct:${pct}%"><div class="goal-inner"><div><b>${Math.round(pct)}%</b><br><span>من الهدف</span></div></div></div><div class="metrics"><div class="metric"><span>المدخر</span><b>${money(data.goal.saved)}</b></div><div class="metric"><span>المتبقي</span><b>${money(remain)}</b></div></div><div class="actions" style="margin-top:13px"><button class="primary" onclick="openGoal()">تعديل الهدف</button><button class="secondary" onclick="addSaving()">إضافة ادخار</button></div></div>
 <div class="card"><div class="section-title"><h2>خطة الادخار</h2></div><p style="font-size:13px;line-height:1.7;margin:0;color:var(--muted)">يمكنك تسجيل كل مبلغ تدخره، وسيتحدث التقدم تلقائيًا. الهدف الحالي ${money(data.goal.target)}.</p></div>`;
}
function openMonthCommitments(){
 let {from,to}=monthBounds(), month=new Date().toLocaleDateString('ar-TN',{month:'long',year:'numeric'});
 let debts=data.debts.filter(d=>d.due>=from&&d.due<=to&&d.total>d.paid);
 let rec=recurringInstances(data.recurringExpenses,from,to).filter(r=>!data.paidRecurring.includes(r.id+'_'+r.date));
 let total=debts.reduce((a,d)=>a+Math.max(0,d.total-d.paid),0)+rec.reduce((a,r)=>a+r.amount,0);
 let rows=[...debts.map(d=>({title:d.title,amount:Math.max(0,d.total-d.paid),date:d.due,icon:'💳',sub:'استحقاق '+fmtDate(d.due),action:`<button class=\"smallbtn\" onclick=\"payDebt('\${d.id}\')\">تسجيل دفعة</button>`})),...rec.map(r=>({title:r.title,amount:r.amount,date:r.date,icon:cats[r.cat]?.[0]||'🔁',sub:'استحقاق '+fmtDate(r.date),action:`<button class=\"smallbtn\" onclick=\"payRecurring('\${r.id}\')\">دفع</button>`}))].sort((a,b)=>a.date.localeCompare(b.date));
 openModal(`<button class=\"closex\" onclick=\"closeModal()\">×</button><h2>التزامات ${month}</h2><div class=\"sub\" style=\"margin-bottom:10px\">هذه القائمة تعرض التزامات هذا الشهر فقط.</div>${rows.map(x=>`<div class=\"row\"><div class=\"ico\">${x.icon}</div><div class=\"row-main\"><b>${x.title}</b><span>${x.sub}</span></div><div style=\"text-align:left\"><div class=\"amount\">${money(x.amount)}</div>${x.action}</div></div>`).join('')||'<div class=\"empty\">لا توجد التزامات متبقية هذا الشهر 🎉</div>'}<div class=\"metrics\" style=\"margin-top:12px\"><div class=\"metric\"><span>مجموع هذا الشهر</span><b>${money(total)}</b></div></div><div class=\"actions\"><button class=\"secondary\" onclick=\"closeModal()\">إغلاق</button></div>`);
}
function openBudgets(){let items=Object.entries(cats).filter(([k])=>['food','fuel','fun','kids','shopping','personal','smoking','cafe'].includes(k));openModal(`<button class="closex" onclick="closeModal()">×</button><h2>ميزانيات الشهر</h2><div class="sub" style="margin-bottom:10px">حدد الحد الشهري لكل فئة. التطبيق ينقص المصروف الفعلي من الميزانية تلقائيًا.</div>${items.map(([k,v])=>`<label>${v[0]} ${v[1]}</label><input id="b_${k}" class="field" type="number" min="0" step="0.01" value="${data.budgets[k]||0}">`).join('')}<div class="actions"><button class="primary" onclick="saveBudgets()">حفظ</button><button class="secondary" onclick="closeModal()">إلغاء</button></div>`)}
function saveBudgets(){Object.keys(data.budgets).forEach(k=>{let el=document.getElementById('b_'+k);if(el)data.budgets[k]=Math.max(0,+el.value||0)});save();closeModal();render();toast('تم تحديث الميزانيات ✓')}
function openModal(inner){document.getElementById('sheet').innerHTML=inner;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function openAdd(type='expense',cat='food'){
 openModal(`<button class="closex" onclick="closeModal()">×</button><h2>إضافة ${type==='income'?'دخل':'مصروف'}</h2>
 ${type==='expense'?`<label>الفئة</label><select id="aCat" class="field">${Object.entries(cats).map(([k,v])=>`<option value="${k}" ${k===cat?'selected':''}>${v[0]} ${v[1]}</option>`).join('')}</select>`:''}
 <label>الوصف</label><input id="aTitle" class="field" placeholder="${type==='income'?'مثال: راتب':'مثال: غداء'}">
 <label>المبلغ (€)</label><input id="aAmount" class="field" type="number" step="0.01" inputmode="decimal" placeholder="0.00">
 <label>التاريخ</label><input id="aDate" class="field" type="date" value="${todayISO()}">
 <div class="actions"><button class="primary" onclick="saveAdd('${type}')">حفظ</button><button class="secondary" onclick="closeModal()">إلغاء</button></div>`);
}
function saveAdd(type){let a=+document.getElementById('aAmount').value;if(!a)return toast('أدخل المبلغ');let x={id:'x'+Date.now(),title:document.getElementById('aTitle').value||'معاملة',amount:a,date:document.getElementById('aDate').value};if(type==='expense')x.cat=document.getElementById('aCat').value;data[type==='income'?'incomes':'expenses'].push(x);save();closeModal();render();toast('تم الحفظ ✓')}
function openRecurring(kind){
 let isIn=kind!=='expense';
 let list=isIn?data.recurringIncomes:data.recurringExpenses;
 openModal(`<button class="closex" onclick="closeModal()">×</button><h2>${isIn?'الدخل المتكرر':'المصاريف المتكررة'}</h2>
 ${list.map((r,i)=>{let today=todayISO(), day=Math.min(r.day,new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate()), key=r.id+'_'+todayISO().slice(0,8)+String(day).padStart(2,'0'), already=data.paidRecurring.includes(key); return `<div class="row"><div class="ico">${isIn?'💰':(cats[r.cat]?.[0]||'🔁')}</div><div class="row-main"><b>${r.title}</b><span>${money(r.amount)} · يوم ${r.day} من كل شهر</span></div>${!isIn?`<button class="smallbtn" onclick="payRecurring('${r.id}')">${already?'تم الدفع ✓':'دفع'}</button>`:''}${!isIn?`<button class="smallbtn" onclick="editRecurring('${r.id}')">تعديل</button>`:''}<button class="smallbtn" onclick="removeRecurring('${isIn?'in':'ex'}','${r.id}')">حذف</button></div>`}).join('')||'<div class="empty">لا يوجد شيء متكرر.</div>'}
 <div class="actions"><button class="primary" onclick="addRecurringForm('${isIn?'income':'expense'}')">＋ إضافة متكرر</button><button class="secondary" onclick="closeModal()">إغلاق</button></div>`);
}
function addRecurringForm(kind){
 let isIn=kind==='income';
 openModal(`<button class="closex" onclick="closeModal()">×</button><h2>${isIn?'دخل متكرر':'مصروف متكرر'}</h2>
 <label>الوصف</label><input id="rTitle" class="field" placeholder="${isIn?'راتب':'مثال: أكل'}">
 <label>المبلغ (€)</label><input id="rAmount" class="field" type="number" step="0.01" inputmode="decimal">
 ${isIn?'':`<label>الفئة</label><select id="rCat" class="field">${Object.entries(cats).map(([k,v])=>`<option value="${k}">${v[0]} ${v[1]}</option>`).join('')}</select>`}
 <label>اليوم من كل شهر</label><input id="rDay" class="field" type="number" min="1" max="31" value="1">
 <label>يبدأ من</label><input id="rStart" class="field" type="date" value="${todayISO()}">
 <div class="actions"><button class="primary" onclick="saveRecurring('${kind}')">حفظ</button><button class="secondary" onclick="openRecurring('${kind}')">رجوع</button></div>`);
}
function saveRecurring(kind){let a=+rAmount.value;if(!a)return toast('أدخل المبلغ');let r={id:'r'+Date.now(),title:rTitle.value||'متكرر',amount:a,day:Math.max(1,Math.min(31,+rDay.value||1)),start:rStart.value};if(kind==='expense')r.cat=rCat.value;(kind==='income'?data.recurringIncomes:data.recurringExpenses).push(r);save();closeModal();render();toast('تمت إضافة التكرار ✓')}
function payRecurring(id){let r=data.recurringExpenses.find(x=>x.id===id);if(!r)return;let d=new Date(), day=Math.min(r.day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()), date=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(day).padStart(2,'0'), key=id+'_'+date;if(data.paidRecurring.includes(key))return toast('تم دفع هذا الشهر ✓');data.expenses.push({id:'x'+Date.now(),title:r.title,amount:r.amount,date,cat:r.cat,recurringId:id});data.paidRecurring.push(key);save();render();toast('تم تسجيل الدفع ✓')}
function editRecurring(id){let r=data.recurringExpenses.find(x=>x.id===id);if(!r)return;openModal(`<button class="closex" onclick="closeModal()">×</button><h2>تعديل ${r.title}</h2><label>الوصف</label><input id="erTitle" class="field" value="${r.title}"><label>المبلغ الشهري (€)</label><input id="erAmount" class="field" type="number" min="0" step="0.01" value="${r.amount}"><label>اليوم من كل شهر</label><input id="erDay" class="field" type="number" min="1" max="31" value="${r.day}"><div class="actions"><button class="primary" onclick="saveEditRecurring('${id}')">حفظ</button><button class="secondary" onclick="closeModal()">إلغاء</button></div>`)}
function saveEditRecurring(id){let r=data.recurringExpenses.find(x=>x.id===id);if(!r)return;r.title=document.getElementById('erTitle').value||r.title;r.amount=Math.max(0,+document.getElementById('erAmount').value||0);r.day=Math.max(1,Math.min(31,+document.getElementById('erDay').value||1));save();closeModal();render();toast('تم تعديل المصروف المتكرر ✓')}
function removeRecurring(type,id){let arr=type==='in'?data.recurringIncomes:data.recurringExpenses;let i=arr.findIndex(x=>x.id===id);if(i>=0)arr.splice(i,1);save();openRecurring(type==='in'?'income':'expense')}
function openDebt(){openModal(`<button class="closex" onclick="closeModal()">×</button><h2>إضافة دين</h2><label>اسم الدين</label><input id="dTitle" class="field" placeholder="مثال: كهرباء"><label>المبلغ (€)</label><input id="dAmount" class="field" type="number" step="0.01"><label>تاريخ الاستحقاق</label><input id="dDue" class="field" type="date"><div class="actions"><button class="primary" onclick="saveDebt()">حفظ</button><button class="secondary" onclick="closeModal()">إلغاء</button></div>`)}
function saveDebt(){let a=+dAmount.value;if(!a)return toast('أدخل المبلغ');data.debts.push({id:'d'+Date.now(),title:dTitle.value||'دين',total:a,paid:0,due:dDue.value});save();closeModal();render();toast('تمت إضافة الدين ✓')}
function payDebt(id){let d=data.debts.find(x=>x.id===id), rem=d.total-d.paid;let a=+prompt('كم دفعت؟',String(rem));if(a>0){a=Math.min(a,rem);d.paid+=a;data.expenses.push({id:'x'+Date.now(),title:d.title,amount:a,date:todayISO(),cat:'debt'});save();render();toast('تم تسجيل الدفعة ✓')}}
function removeDebt(id){if(confirm('حذف هذا الدين؟')){data.debts=data.debts.filter(x=>x.id!==id);save();render()}}
function openGoal(){openModal(`<button class="closex" onclick="closeModal()">×</button><h2>هدف المنزل</h2><label>اسم الهدف</label><input id="gName" class="field" value="${data.goal.name}"><label>المبلغ المستهدف (€)</label><input id="gTarget" class="field" type="number" value="${data.goal.target}"><label>المدخر حاليًا (€)</label><input id="gSaved" class="field" type="number" value="${data.goal.saved}"><div class="actions"><button class="primary" onclick="saveGoal()">حفظ</button><button class="secondary" onclick="closeModal()">إلغاء</button></div>`)}
function saveGoal(){data.goal={name:gName.value||'شراء منزل',target:+gTarget.value||30000,saved:+gSaved.value||0};save();closeModal();render();toast('تم تحديث الهدف ✓')}
function addSaving(){let a=+prompt('كم تريد إضافة إلى ادخار المنزل؟','100');if(a>0){data.goal.saved+=a;save();render();toast('تمت إضافة الادخار ✓')}}
function go(p){page=p;render()}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
render();
</script>
</body></html>
